# blrl: branch to LR and link. Target is LR as it was before the instruction;
# LR then becomes the address of the next instruction. Halo Wars has one site,
# the C++ EH runtime's _CallSettingFrame (mtlr r3; blrl) calling a funclet.
#
# Words are standard PPC encodings (encode.py only knows the VMX128 table):
#   0x4E800021 blrl            0x7C8802A6 mflr r4      0x7CA803A6 mtlr r5
#   0x38601234 li r3,0x1234    0x38630001 addi r3,r3,1 0x7CC802A6 mflr r6

[[case]]
name = "calls_old_lr_and_links"
mnemonic = "blrl"
source = "xenia src/xenia/cpu/ppc/ppc_emit_control.cc InstrEmit_bclrx (BO=20, LK=1): NIA = LR, then LR = CIA + 4"
insns = [0x4E800021]              # blrl
callee = [0x38601234, 0x7C8802A6] # li r3,0x1234 ; mflr r4
[case.in]
lr = "callee"
r3 = 0
r4 = 0
[case.out]
r3 = 0x1234          # the callee ran
r4 = "self + 4"      # the callee saw LR = next instruction
lr = "self + 4"

[[case]]
name = "returns_to_next_instruction"
mnemonic = "blrl"
source = "xenia src/xenia/cpu/ppc/ppc_emit_control.cc InstrEmit_bclrx (BO=20, LK=1): LK links, execution resumes at CIA + 4"
insns = [0x4E800021, 0x38630001]  # blrl ; addi r3,r3,1
callee = [0x38601234]             # li r3,0x1234
[case.in]
lr = "callee"
[case.out]
r3 = 0x1235          # callee result, then the instruction after blrl
lr = "self + 4"      # not self + 8: LR is the blrl's own return address

[[case]]
name = "mtlr_then_blrl"
mnemonic = "mtlr"
source = "xenia src/xenia/cpu/ppc/ppc_emit_control.cc InstrEmit_bclrx; the Halo Wars _CallSettingFrame shape (mtlr rN; blrl)"
insns = [0x7CA803A6, 0x4E800021]  # mtlr r5 ; blrl
callee = [0x7CC802A6]             # mflr r6
[case.in]
r5 = "callee"
lr = 0xDEAD0000      # must be ignored: mtlr replaces it
[case.out]
r6 = "self + 8"
lr = "self + 8"
