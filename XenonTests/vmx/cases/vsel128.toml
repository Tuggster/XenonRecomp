# Plain vsel (VXA form) with the same vectors as test_vsel_3, hand-encoded:
# 0x10000000 | 5<<21 | 3<<16 | 4<<11 | 5<<6 | 42.
[[case]]
name = "plain_vsel_xenia_test_vsel_3"
mnemonic = "vsel"
source = "xenia src/xenia/cpu/ppc/testing/instr_vsel.s test_vsel_3; ppc_emit_altivec.cc InstrEmit_vsel (VXA.VC is the mask)"
insns = [0x10A3216A]   # vsel v5,v3,v4,v5
