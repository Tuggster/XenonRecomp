# Plain vsel where the mask is a register other than vD, to check the VC field
# is really read (vsel v6,v3,v4,v5; v6 starts as garbage that must not matter).
[[case]]
name = "plain_vsel_separate_vc"
mnemonic = "vsel"
source = "ppc_emit_altivec.cc InstrEmit_vsel: VRT = (VRC bit 0) ? VRA : VRB per bit"
insns = [0x10C3216A]   # vsel v6,v3,v4,v5
[case.in]
v3 = { u32 = [0xAAAAAAAA, 0xAAAAAAAA, 0xAAAAAAAA, 0xAAAAAAAA] }
v4 = { u32 = [0x55555555, 0x55555555, 0x55555555, 0x55555555] }
v5 = { u32 = [0x00000000, 0xFFFFFFFF, 0x0000FFFF, 0xF0F0F0F0] }
v6 = { u32 = [0xDEADBEEF, 0xDEADBEEF, 0xDEADBEEF, 0xDEADBEEF] }
[case.out]
v5 = { u32 = [0x00000000, 0xFFFFFFFF, 0x0000FFFF, 0xF0F0F0F0] }
v6 = { u32 = [0xAAAAAAAA, 0x55555555, 0xAAAA5555, 0x5A5A5A5A] }

# ---------------------------------------------------------------------------
# Game register numbers (split VD128/VA128/VB128 fields, high bits set)
# ---------------------------------------------------------------------------

# vsel128 v125,v63,v61,v125 is the most common site (6). Per-element masks so
# every lane is exercised: element 0 all from vA, 1 all from vB, 2 and 3 mixed.
[[case]]
name = "game_v125_v63_v61_per_lane_masks"
mnemonic = "vsel128"
source = "ppc_emit_altivec.cc InstrEmit_vsel128 (vc = VX128_VD128); HaloWars site vsel128 v125,v63,v61,v125"
insns = [0x17BFEB7D]   # vsel128 v125,v63,v61,v125
[case.in]
v63  = { u32 = [0x11111111, 0x22222222, 0x33333333, 0x44444444] }
v61  = { u32 = [0xEEEEEEEE, 0xDDDDDDDD, 0xCCCCCCCC, 0xBBBBBBBB] }
v125 = { u32 = [0x00000000, 0xFFFFFFFF, 0xFF00FF00, 0x0F0F0F0F] }
[case.out]
v63  = { u32 = [0x11111111, 0x22222222, 0x33333333, 0x44444444] }
v61  = { u32 = [0xEEEEEEEE, 0xDDDDDDDD, 0xCCCCCCCC, 0xBBBBBBBB] }
v125 = { u32 = [0x11111111, 0xDDDDDDDD, 0xCC33CC33, 0x4B4B4B4B] }

