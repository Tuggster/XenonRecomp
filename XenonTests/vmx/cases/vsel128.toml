# vsel128 vD,vA,vB,vD: VX128_2 form, OP 5, xop 848. Bitwise select:
#   vD = (vA & ~mask) | (vB & mask)
# where the mask is the third source. In the VMX128 encoding there is no VC
# field; the mask is vD itself (Xenia InstrEmit_vsel128 passes VX128_VD128 as
# vc; XenonRecomp's disassembler lists the operand as VS128, which decodes to
# the same split VD128 field, so operands[3] == operands[0]).
#
# Plain vsel vD,vA,vB,vC (VXA form, xop 42) is hand-encoded here and shares the
# same case; it has the separate VC field.
#
# Xenia's instr_vsel.s cases are transcribed first (as vsel128 and as plain
# vsel), then the game's actual 128-register numbers.

[[case]]
name = "xenia_test_vsel_1_mask_zero_takes_va"
mnemonic = "vsel128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vsel.s test_vsel_1; ppc_emit_altivec.cc InstrEmit_vsel_ (Select(vc, va, vb): mask bit 0 -> va)"
insns = [0x14A32350]   # vsel128 v5,v3,v4,v5
[case.in]
v3 = { u32 = [0x00010203, 0x04050607, 0x08090A0B, 0x0C0D0E0F] }
v4 = { u32 = [0x10111213, 0x14151617, 0x18191A1B, 0x1C1D1E1F] }
v5 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000000] }
[case.out]
v3 = { u32 = [0x00010203, 0x04050607, 0x08090A0B, 0x0C0D0E0F] }
v4 = { u32 = [0x10111213, 0x14151617, 0x18191A1B, 0x1C1D1E1F] }
v5 = { u32 = [0x00010203, 0x04050607, 0x08090A0B, 0x0C0D0E0F] }

