# ---------------------------------------------------------------------------

[[case]]
name = "plain_vpkswss_xenia_test_vpkswss_3"
mnemonic = "vpkswss"
source = "xenia src/xenia/cpu/ppc/testing/instr_vpkswss.s test_vpkswss_3; ppc_emit_altivec.cc InstrEmit_vpkswss"
insns = [0x10A321CE]   # vpkswss v5,v3,v4
[case.in]
v3 = { u32 = [0xFFFFFFFF, 0xFFFF8000, 0x00000000, 0x00007FFF] }
v4 = { u32 = [0xFFFFFFFE, 0xFFFF7FFF, 0x00000001, 0x00008000] }
[case.out]
v5 = { u32 = [0xFFFF8000, 0x00007FFF, 0xFFFE8000, 0x00017FFF] }

[[case]]
name = "plain_vpkswss_xenia_test_vpkswss_2"
mnemonic = "vpkswss"
