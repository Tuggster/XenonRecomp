# vpkswss128 vD,vA,vB: VX128 form, OP 5, xop 640. Pack signed word to signed
# halfword with saturation:
#   vD.h[0..3] = clamp(vA.w[0..3], -32768, 32767)
#   vD.h[4..7] = clamp(vB.w[0..3], -32768, 32767)
# Xenia InstrEmit_vpkswss_ (ppc_emit_altivec.cc): Pack(va, vb, 16_IN_32 |
# IN_SIGNED | OUT_SIGNED | OUT_SATURATE); x64_seq_vector.cc Emit16_IN_32 uses
# vpackssdw. VSCR[SAT] is not modeled by XenonRecomp.
#
# Plain vpkswss (VX form, xop 462) is hand-encoded:
# 0x10000000 | vd<<21 | va<<16 | vb<<11 | 462.

# ---------------------------------------------------------------------------
# Xenia src/xenia/cpu/ppc/testing/instr_vpkswss128.s, transcribed
# ---------------------------------------------------------------------------

[[case]]
name = "xenia_test_vpkswss128_1_small_values"
mnemonic = "vpkswss128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vpkswss128.s test_vpkswss128_1; ppc_emit_altivec.cc InstrEmit_vpkswss_"
insns = [0x14A32280]   # vpkswss128 v5,v3,v4
[case.in]
v3 = { u32 = [0x00000001, 0x00000002, 0x00000003, 0x00000004] }
v4 = { u32 = [0x00000005, 0x00000006, 0x00000007, 0x00000008] }
[case.out]
v3 = { u32 = [0x00000001, 0x00000002, 0x00000003, 0x00000004] }
v4 = { u32 = [0x00000005, 0x00000006, 0x00000007, 0x00000008] }
v5 = { u32 = [0x00010002, 0x00030004, 0x00050006, 0x00070008] }

[[case]]
name = "xenia_test_vpkswss128_2_int_extremes"
mnemonic = "vpkswss128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vpkswss128.s test_vpkswss128_2; ppc_emit_altivec.cc InstrEmit_vpkswss_"
insns = [0x14A32280]   # vpkswss128 v5,v3,v4
[case.in]
v3 = { u32 = [0x7FFFFFFF, 0x80000000, 0x00000000, 0x00000004] }
v4 = { u32 = [0x7FFFFFFF, 0x80000000, 0x00000000, 0x00000008] }
[case.out]
v3 = { u32 = [0x7FFFFFFF, 0x80000000, 0x00000000, 0x00000004] }
v4 = { u32 = [0x7FFFFFFF, 0x80000000, 0x00000000, 0x00000008] }
v5 = { u32 = [0x7FFF8000, 0x00000004, 0x7FFF8000, 0x00000008] }

[[case]]
name = "xenia_test_vpkswss128_3_short_boundaries"
mnemonic = "vpkswss128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vpkswss128.s test_vpkswss128_3; ppc_emit_altivec.cc InstrEmit_vpkswss_"
insns = [0x14A32280]   # vpkswss128 v5,v3,v4
[case.in]
# {-1, -32768, 0, 32767}
v3 = { u32 = [0xFFFFFFFF, 0xFFFF8000, 0x00000000, 0x00007FFF] }
# {-2, -32769, 1, 32768}
v4 = { u32 = [0xFFFFFFFE, 0xFFFF7FFF, 0x00000001, 0x00008000] }
[case.out]
v3 = { u32 = [0xFFFFFFFF, 0xFFFF8000, 0x00000000, 0x00007FFF] }
v4 = { u32 = [0xFFFFFFFE, 0xFFFF7FFF, 0x00000001, 0x00008000] }
# {-1, -32768, 0, 32767, -2, -32768, 1, 32767}
v5 = { u32 = [0xFFFF8000, 0x00007FFF, 0xFFFE8000, 0x00017FFF] }

