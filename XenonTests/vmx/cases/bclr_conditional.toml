name = "beqlr_taken_returns"
source = "PowerPC ISA Book I, BO field: 1z1zz is branch-always; 1z01y (bdz) and 1z00y (bdnz) decrement and test CTR. xenia src/xenia/cpu/ppc/ppc_emit_control.cc InstrEmit_bclrx; BO 0x0C has bit 0x10 clear and was already conditional"
