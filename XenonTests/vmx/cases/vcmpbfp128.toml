source = "Halo Wars site (vd aliases va; the game then does mfocrf r11,2 / rlwinm. r11,r11,0,26,26 / beq, i.e. reads only cr6.eq). xenia InstrEmit_vcmpbfp_"
insns = [0x1BFFF1E5]   # vcmpbfp128. v63,v63,v62
[case.in]
v63 = { f32 = [1.0, 3.0, -3.0, 0.5] }
v62 = { f32 = [2.0, 2.0, 2.0, 2.0] }
[case.out]
v63 = { u32 = [0, 0x80000000, 0x40000000, 0] }
v62 = { f32 = [2.0, 2.0, 2.0, 2.0] }
cr6 = ""

[[case]]
name = "game_v63_v63_v62_in_bounds"
mnemonic = "vcmpbfp128."
