mnemonic = "vcmpbfp128."
source = "Halo Wars site (vd aliases va; the game reads cr6.eq via mfocrf r11,2 / rlwinm. 26,26 / bne). xenia InstrEmit_vcmpbfp_ + UpdateCR6 -> cr6.eq"
insns = [0x1BFFC9E5]   # vcmpbfp128. v63,v63,v57
