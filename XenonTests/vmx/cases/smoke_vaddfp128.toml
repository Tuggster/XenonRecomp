# Harness smoke tests on an instruction XenonRecomp already implements.
# vaddfp128: VX128 form, OP 5, xop 16 (thirdparty/disasm/ppc-dis.c, "vaddfp128").
# Vector lanes are written in PPC element order [e0, e1, e2, e3].

[[case]]
name = "xenia_test_vaddfp128_1"
mnemonic = "vaddfp128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vaddfp128.s test_vaddfp128_1; semantics src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_vaddfp_ (VectorAdd FLOAT32)"
insns = [0x14032010]   # vaddfp128 v0,v3,v4
[case.in]
v3 = { u32 = [0x41200000, 0xC1200000, 0x41700000, 0xC1700000] }   # [10, -10, 15, -15]
v4 = { u32 = [0xC1200000, 0x41A00000, 0xC1A00000, 0x41F00000] }   # [-10, 20, -20, 30]
[case.out]
v0 = { u32 = [0x00000000, 0x41200000, 0xC0A00000, 0x41700000] }   # [0, 10, -5, 15]
v3 = { u32 = [0x41200000, 0xC1200000, 0x41700000, 0xC1700000] }
v4 = { u32 = [0xC1200000, 0x41A00000, 0xC1A00000, 0x41F00000] }

[[case]]
name = "high_registers"
mnemonic = "vaddfp128"
source = "xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_vaddfp128 (VX128_VD128/VA128/VB128 split fields, ppc_instr.h VX128)"
insns = [0x14810C1D]   # vaddfp128 v100,v65,v33
[case.in]
v65 = { f32 = [0.5, 0.25, -1.0, 100.0] }
v33 = { f32 = [1.0, 2.0, 3.0, 4.0] }
[case.out]
v100 = { f32 = [1.5, 2.25, 2.0, 104.0] }

[[case]]
name = "infinities_and_signed_zero"
mnemonic = "vaddfp128"
source = "xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_vaddfp_: VectorAdd FLOAT32 is a plain IEEE add (x64 vaddps), round to nearest"
insns = [0x14032010]   # vaddfp128 v0,v3,v4
[case.in]
v3 = { f32 = ["inf", "-inf", 1.0, 0.0] }
v4 = { f32 = [1.0, 1.0, -1.0, -0.0] }
[case.out]
v0 = { f32 = ["inf", "-inf", 0.0, 0.0] }
