# ---------------------------------------------------------------------------------------
# Host FP-mode interplay. The recompiler emits ctx.fpscr.enableFlushMode*() before VMX float
# ops only when its tracked state is not already VMX, so the convert is run (a) on its own,
# where it emits the switch itself (every case above), (b) after a VMX op that already switched,
# and (c) after a scalar FPU op that switched the other way. The results must not depend on it.

[[case]]
name = "after_vaddfp128_flush_mode_already_on"
mnemonic = "vaddfp128"
source = "xenia ppc_emit_altivec.cc InstrEmit_vctuxs_; the convert follows a vaddfp128 so the recompiler emits no flush-mode switch for it"
insns = [0x154A5010, 0x18600270]   # vaddfp128 v10,v10,v10 ; vcfpuxws128 v3,v0,0
[case.in]
v10 = { f32 = [1.0, 2.0, 3.0, 4.0] }
v0 = { u32 = [0x40400000, 0x7FC00000, 0x7F800000, 0x4F400000] }
[case.out]
v10 = { f32 = [2.0, 4.0, 6.0, 8.0] }
v3 = { u32 = [0x00000003, 0x00000000, 0xFFFFFFFF, 0xC0000000] }

[[case]]
name = "after_vaddfp128_saturation_boundaries"
mnemonic = "vaddfp128"
source = "xenia ppc_emit_altivec.cc InstrEmit_vctuxs_; saturation_boundaries with flush mode already on"
insns = [0x154A5010, 0x18600270]   # vaddfp128 v10,v10,v10 ; vcfpuxws128 v3,v0,0
[case.in]
v10 = { f32 = [0.5, -0.5, 0.0, 1.0] }
v0 = { u32 = [0x4F7FFFFF, 0x4EFFFFFF, 0x4F000001, 0xCF000000] }
[case.out]
v10 = { f32 = [1.0, -1.0, 0.0, 2.0] }
v3 = { u32 = [0xFFFFFF00, 0x7FFFFF80, 0x80000100, 0x00000000] }

[[case]]
name = "after_vaddfp128_scale31"
mnemonic = "vaddfp128"
source = "xenia ppc_emit_altivec.cc InstrEmit_vctuxs_; scale31 with flush mode already on"
insns = [0x154A5010, 0x187F0270]   # vaddfp128 v10,v10,v10 ; vcfpuxws128 v3,v0,31
[case.in]
v10 = { f32 = [1.0, 2.0, 3.0, 4.0] }
v0 = { u32 = [0x3F800000, 0x30000000, 0x2F800000, 0x3FFFFFFF] }
[case.out]
v3 = { u32 = [0x80000000, 0x00000001, 0x00000000, 0xFFFFFF00] }

[[case]]
name = "after_fadd_flush_mode_was_off"
mnemonic = "fadd"
source = "xenia ppc_emit_altivec.cc InstrEmit_vctuxs_; a scalar fadd first puts the recompiler in FPU mode, so the convert re-enables flush mode"
insns = [0xFC21102A, 0x18600270]   # fadd f1,f1,f2 ; vcfpuxws128 v3,v0,0
[case.in]
f1 = 1.5
f2 = 2.25
v0 = { u32 = [0x40400000, 0x7FC00000, 0x7F800000, 0x4F400000] }
[case.out]
f1 = 3.75
v3 = { u32 = [0x00000003, 0x00000000, 0xFFFFFFFF, 0xC0000000] }
