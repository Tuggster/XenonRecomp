# vcfpuxws128 (VMX128 form of vctuxs): float -> unsigned 32-bit, scaled by 2^uimm.
#
# Reference: xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_vctuxs_ (shared by vctuxs and
# vcfpuxws128): v = Mul(VB, splat(2^uimm)); v = VectorConvertF2I(v, ARITHMETIC_UNSIGNED).
# Lowered by src/xenia/cpu/backend/x64/x64_seq_vector.cc VECTOR_CONVERT_F2I (unsigned, non-AVX512
# path): vmaxps with 0 (NaN and negatives -> 0), values >= 2^31 are shifted down by 2^31 before
# vcvttps2dq (truncation) and shifted back after, and lanes that vcvttps2dq could not represent
# (>= 2^32, +inf) are OR'd to 0xFFFFFFFF. Net semantics, which are also the AltiVec ISA's:
#   truncate toward zero, saturate to [0, 0xFFFFFFFF], NaN -> 0.
# Xenia's AVX512 path disagrees for NaN: its _CMP_NLT_UQ mask is true for unordered lanes, so
# vcvttps2udq gives 0xFFFFFFFF there. We follow the non-AVX512 path and the ISA (NaN -> 0).
# XenonRecomp implements this with simde_mm_vctuxs (XenonUtils/ppc_context.h), written so the
# result does not depend on cvttps_epi32's out-of-range behaviour (x86: INT_MIN; NEON: saturate).
#
# Every Halo Wars site uses scale 0 (12x v1,v63,0; 4x v63,v63,0; v125,v63,0; v127,v63,0).
# Scales 3 and 31 are covered too (31 is what Xenia's own tests use).
#
# Encoding (XenonTests/vmx/encode.py): VX128_3, OP 6, xop 624; uimm in bits 16..20.
# vaddfp128 v10,v10,v10 (0x154A5010) is the "prior VMX float op" used to make the recompiler's
# flush-mode state already VMX before the convert, so both the enableFlushMode-emitting and the
# non-emitting paths are run. fadd f1,f1,f2 (0xFC21102A) puts the state in FPU mode first.

# ---------------------------------------------------------------------------------------
# Xenia's own test vectors (src/xenia/cpu/ppc/testing/instr_vctuxs.s), run through the 128 form.

[[case]]
name = "xenia_test_vctuxs_1_zero_scale31"
mnemonic = "vcfpuxws128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vctuxs.s test_vctuxs_1 (0 * 2^31)"
insns = [0x187F0270]   # vcfpuxws128 v3,v0,31
[case.in]
v0 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000000] }
[case.out]
v0 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000000] }
v3 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000000] }

