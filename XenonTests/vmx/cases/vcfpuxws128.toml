# ---------------------------------------------------------------------------------------
# NaN, truncation, saturation edges, mixed lanes.

[[case]]
name = "nan_lanes_are_zero"
mnemonic = "vcfpuxws128"
source = "xenia src/xenia/cpu/backend/x64/x64_seq_vector.cc VECTOR_CONVERT_F2I unsigned: vmaxps(src, 0) returns 0 for NaN (non-AVX512 path and AltiVec ISA; Xenia's AVX512 path would give 0xFFFFFFFF) (quiet, signalling, negative NaN, all-ones)"
insns = [0x18600270]   # vcfpuxws128 v3,v0,0
[case.in]
v0 = { u32 = [0x7FC00000, 0xFFC00000, 0x7F800001, 0xFFFFFFFF] }
[case.out]
v3 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000000] }

[[case]]
name = "truncates_toward_zero"
