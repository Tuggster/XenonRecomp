# ---------------------------------------------------------------------------
# NORMPACKED64 4_20_20_20 (type 6, imm 24), packed w_z_y_x in the 64-bit
# value V = VB.z:VB.w (VB.z high):
#   x = 3.0 + s20(V[19:0]) * 2^-22, y = 3.0 + s20(V[39:20]) * 2^-22,
#   z = 3.0 + s20(V[59:40]) * 2^-22, w = 1.0 + u4(V[63:60]) * 2^-23;
#   -524288 -> quiet NaN
# Xenia has no .s test for this type; the expectations below are worked by
# hand from the x64 sequence (XMMUnpackULONG_4202020_Permute, vpsrld 4,
# vshufps, vpslld/vpsrad 12, vpaddd XMM3331, XMMUnpackULONG_4202020_Overflow
# 0x40380000) and cross-checked against the pack-side saturation constants
# XMMPackULONG_4202020_MinUnpacked 0x40380001 / MaxUnpacked 0x4047FFFF.
# ---------------------------------------------------------------------------

[[case]]
name = "ulong_4202020_zero"
mnemonic = "vupkd3d128"
source = "xenia x64_seq_vector.cc UNPACK EmitULONG_4202020 (constant-zero fast path returns XMM3331 = 3, 3, 3, 1)"
insns = [0x18781FF0]   # vupkd3d128 v3,v3,24
[case.in]
v3 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0, 0] }
[case.out]
v3 = { f32 = [3.0, 3.0, 3.0, 1.0] }

[[case]]
name = "ulong_4202020_lane_fields"
mnemonic = "vupkd3d128"
source = "xenia x64_seq_vector.cc UNPACK EmitULONG_4202020, worked by hand: x = 2, y = -2 (0xFFFFE), z = 524287 (0x7FFFF, = XMMPackULONG_4202020_MaxUnpacked 0x4047FFFF), w = 15"
insns = [0x18781FF0]   # vupkd3d128 v3,v3,24
[case.in]
v3 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0xF7FFFFFF, 0xFFE00002] }
[case.out]
v3 = { u32 = [0x40400002, 0x403FFFFE, 0x4047FFFF, 0x3F80000F] }

[[case]]
name = "ulong_4202020_min_and_overflow"
mnemonic = "vupkd3d128"
source = "xenia x64_seq_vector.cc UNPACK EmitULONG_4202020, worked by hand: x = -524287 (0x80001, = XMMPackULONG_4202020_MinUnpacked 0x40380001), y = -524288 (0x80000 -> XMMUnpackULONG_4202020_Overflow -> XMMQNaN), z = 1, w = 0"
insns = [0x18B84FF0]   # vupkd3d128 v5,v9,24
[case.in]
