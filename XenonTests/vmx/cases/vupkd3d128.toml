[[case]]
name = "float16_4_denormals"
mnemonic = "vupkd3d128"
source = "xenia x64_seq_vector.cc UNPACK EmulateFLOAT16_4 (half2float converts half denormals exactly: 0x0001 = 2^-24, 0x03FF = 1023 * 2^-24; 0x0400 is the smallest normal, 2^-14); F16C vcvtph2ps agrees"
insns = [0x18741FF0]   # vupkd3d128 v3,v3,20
[case.in]
v3 = { u32 = [0, 0, 0x00018001, 0x03FF0400] }
[case.out]
v3 = { u32 = [0x33800000, 0xB3800000, 0x387FC000, 0x38800000] }

# Same as above, but run after a VMX float op so the recompiler has switched
# the host into flush mode (FZ|FZ16 on arm64). Half denormals must still
# convert exactly: Xenia does not flush them on either of its paths.
[[case]]
name = "float16_4_denormals_under_flush_mode"
mnemonic = "vaddfp128"
source = "xenia x64_seq_vector.cc UNPACK EmulateFLOAT16_4 (half2float, denormals exact); XenonRecomp emits fpscr.enableFlushMode() before vaddfp128"
insns = [0x14210810, 0x18741FF0]   # vaddfp128 v1,v1,v1 ; vupkd3d128 v3,v3,20
[case.in]
v1 = { f32 = [1.0, 1.0, 1.0, 1.0] }
v3 = { u32 = [0, 0, 0x00018001, 0x03FF0400] }
[case.out]
v1 = { f32 = [2.0, 2.0, 2.0, 2.0] }
v3 = { u32 = [0x33800000, 0xB3800000, 0x387FC000, 0x38800000] }

