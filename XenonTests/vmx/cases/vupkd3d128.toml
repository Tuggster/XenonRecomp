# vupkd3d128 vd, vb, imm: VX128_3 form, OP 6, xop 2032; type = imm >> 2.
#
# Types (xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_vupkd3d128):
#   0 D3DCOLOR (imm 0)      1 NORMSHORT2 (imm 4)      2 NORMPACKED32 2_10_10_10 (imm 8)
#   3 FLOAT16_2 (imm 12)    4 NORMSHORT4 (imm 16)     5 FLOAT16_4 (imm 20)
#   6 NORMPACKED64 4_20_20_20 (imm 24)
# Types 0 and 1 are covered by smoke_vupkd3d128.toml. Halo Wars uses types 5
# (166 sites) and 3 (5 sites).
#
# Half-float reference values (IEEE binary16 -> binary32, as half2float does):
#   3C00 = 1.0 -> 3F800000     3800 = 0.5 -> 3F000000     4200 = 3.0 -> 40400000
#   4500 = 5.0 -> 40A00000     7BFF = 65504 -> 477FE000   0400 = 2^-14 -> 38800000
#   0001 = 2^-24 -> 33800000   03FF = 1023*2^-24 -> 387FC000
#   7C00 = inf -> 7F800000     7E00 = qNaN -> 7FC00000    7C01 = sNaN -> NaN
#   8000 = -0.0 -> 80000000

# ---------------------------------------------------------------------------
# FLOAT16_4 (type 5, imm 20): x = half(VB.z >> 16), y = half(VB.z & 0xFFFF),
#                             z = half(VB.w >> 16), w = half(VB.w & 0xFFFF)
# ---------------------------------------------------------------------------

[[case]]
name = "xenia_test_vupkd3d128_float16_4_0"
mnemonic = "vupkd3d128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vupkd3d128.s test_vupkd3d128_float16_4_0; x64_seq_vector.cc UNPACK EmitFLOAT16_4 / EmulateFLOAT16_4"
insns = [0x18741FF0]   # vupkd3d128 v3,v3,20
[case.in]
v3 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0x3800B801, 0x3802B803] }
[case.out]
v3 = { u32 = [0x3F000000, 0xBF002000, 0x3F004000, 0xBF006000] }

