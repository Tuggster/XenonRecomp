# lvxl128: load vector indexed, LRU hint (VMX128 form). Identical to lvx128:
# EA = (RA|0) + RB, the low 4 bits are ignored, the whole aligned quadword is
# loaded. Xenia: InstrEmit_lvxl128 -> InstrEmit_lvx128 -> InstrEmit_lvx_
# (ea & ~0xF, ByteSwap(Load(ea, VEC128))). Halo Wars has 64 sites, all with
# RA != 0 and VD >= 64 (e.g. lvxl128 v80,r5,r11), so the split VD128 field
# matters. Expectations mirror xenia's test_lvx-style lvexx cases.
#
# Words from encode.py:
#   0x106022C3 lvxl128 v3,r0,r4     0x12055ACB lvxl128 v80,r5,r11
#   0x13E42ACF lvxl128 v127,r4,r5

[[case]]
name = "aligned_ra0"
mnemonic = "lvxl128"
source = "xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_lvxl128 -> InstrEmit_lvx_; same shape as testing/instr_lvexx.s test_lvehx_1"
insns = [0x106022C3]   # lvxl128 v3,r0,r4
[case.in]
r4 = 0x10001000
mem = [ { addr = 0x10001000, bytes = "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f" } ]
[case.out]
r4 = 0x10001000
v3 = { u32 = [0x00010203, 0x04050607, 0x08090A0B, 0x0C0D0E0F] }

[[case]]
name = "unaligned_low_bits_ignored"
mnemonic = "lvxl128"
source = "xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_lvx_ (ea & ~0xF); testing/instr_lvexx.s test_lvehx_2 (EA+4 loads the same quadword)"
insns = [0x106022C3]   # lvxl128 v3,r0,r4
[case.in]
r4 = 0x1000100C
mem = [
  { addr = 0x10001000, bytes = "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f" },
  { addr = 0x10001010, bytes = "ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff" },
]
[case.out]
v3 = { u32 = [0x00010203, 0x04050607, 0x08090A0B, 0x0C0D0E0F] }

[[case]]
name = "ra_plus_rb_high_register"
mnemonic = "lvxl128"
source = "xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_lvx_ with CalculateEA_0 (RA != 0: EA = RA + RB); VD128 split field (ppc_instr.h VX128_1)"
insns = [0x12055ACB]   # lvxl128 v80,r5,r11  (the Halo Wars form)
[case.in]
r5 = 0x10001000
r11 = 0x2F            # EA = 0x1000102F -> quadword at 0x10001020
v80 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD] }
mem = [
  { addr = 0x10001010, bytes = "ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff ff" },
  { addr = 0x10001020, bytes = "3f 80 00 00 40 00 00 00 c0 40 00 00 7f c0 00 00" },
]
[case.out]
r5 = 0x10001000
r11 = 0x2F
v80 = { u32 = [0x3F800000, 0x40000000, 0xC0400000, 0x7FC00000] }

[[case]]
name = "v127_does_not_clobber_neighbours"
mnemonic = "lvxl128"
source = "xenia src/xenia/cpu/ppc/ppc_emit_altivec.cc InstrEmit_lvx_; VD128 = 127 exercises both high bits of the split field"
insns = [0x13E42ACF]   # lvxl128 v127,r4,r5
[case.in]
r4 = 0x10000000
r5 = 0x00001008
v126 = { u32 = [0x11111111, 0x22222222, 0x33333333, 0x44444444] }
v31 = { u32 = [0xAAAAAAAA, 0xBBBBBBBB, 0xCCCCCCCC, 0xDDDDDDDD] }
mem = [ { addr = 0x10001000, bytes = "de ad be ef 01 23 45 67 89 ab cd ef fe dc ba 98" } ]
[case.out]
v127 = { u32 = [0xDEADBEEF, 0x01234567, 0x89ABCDEF, 0xFEDCBA98] }
v126 = { u32 = [0x11111111, 0x22222222, 0x33333333, 0x44444444] }
v31 = { u32 = [0xAAAAAAAA, 0xBBBBBBBB, 0xCCCCCCCC, 0xDDDDDDDD] }
