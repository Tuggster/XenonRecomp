# vslo128 vD,vA,vB: VX128 form, OP 5, xop 912. Shift left by octet:
#   n  = (vB byte 15 & 0x78) >> 3        (byte 15 = low byte of element 3)
#   vD = vA << (8 * n), zeros shifted in
# Xenia InstrEmit_vslo_ (ppc_emit_altivec.cc): Extract(vb, 15, INT8) & 0x78,
# >> 3, then Permute(LoadVectorShl(sh), va, zero). Bits 0..2 and bit 7 of the
# shift byte are ignored, so n is 0..15.
#
# In element order, PPC byte i of the result is PPC byte i + n of vA, or zero
# when i + n > 15: bytes move toward element 0 (the "left" of the big-endian
# vector). In XenonRecomp's reversed host storage that is a move toward higher
# u8 indices and the shift byte is u8[0].
#
# Plain vslo (VX form, xop 1036) shares the implementation; it is hand-encoded:
# 0x10000000 | vd<<21 | va<<16 | vb<<11 | 1036.

# ---------------------------------------------------------------------------
# Xenia src/xenia/cpu/ppc/testing/instr_vslo.s, transcribed as vslo128
# ---------------------------------------------------------------------------

[[case]]
name = "xenia_test_vslo_1_shift_byte_0x04_is_zero"
mnemonic = "vslo128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vslo.s test_vslo_1; ppc_emit_altivec.cc InstrEmit_vslo_ (0x04 & 0x78 = 0)"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x04040404, 0x04040404, 0x04040404, 0x04040404] }
[case.out]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x04040404, 0x04040404, 0x04040404, 0x04040404] }

