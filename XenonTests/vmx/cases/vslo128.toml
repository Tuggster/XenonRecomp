# ---------------------------------------------------------------------------
# Only byte 15 of vB is the shift amount; the rest of vB is noise.
# ---------------------------------------------------------------------------

# Every other byte of vB says "shift 15" but byte 15 says 0.
[[case]]
name = "only_byte15_counts_shift_0"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo_: Extract(LoadVR(vb), 15, INT8_TYPE)"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x78787878, 0x78787878, 0x78787878, 0x78787800] }
[case.out]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }

# Every other byte of vB is zero; byte 15 is 0x08 -> shift 1.
[[case]]
name = "only_byte15_counts_shift_1"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo_: Extract(LoadVR(vb), 15, INT8_TYPE)"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000008] }
[case.out]
v3 = { u32 = [0x11223344, 0x55667788, 0x99AABBCC, 0xDDEEFF00] }

# Byte 15 = 0x7F: bits 0..2 ignored, & 0x78 = 0x78 -> 15.
[[case]]
name = "only_byte15_counts_shift_15_masked_0x7F"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo_: And(..., 0x78) then Shr 3"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x0000007F] }
[case.out]
v3 = { u32 = [0xFF000000, 0x00000000, 0x00000000, 0x00000000] }

# Byte 15 = 0x87: bit 7 and bits 0..2 set, & 0x78 = 0 -> no shift.
[[case]]
name = "masked_bits_0x87_is_shift_0"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo_: And(..., 0x78)"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000087] }
[case.out]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }

# Byte 15 = 0xBC: & 0x78 = 0x38 -> 7 octets (crosses an element boundary
# and the 64-bit half).
[[case]]
name = "masked_bits_0xBC_is_shift_7"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo_: (0xBC & 0x78) >> 3 = 7"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x000000BC] }
[case.out]
v3 = { u32 = [0x778899AA, 0xBBCCDDEE, 0xFF000000, 0x00000000] }

# Shift 8: exactly one 64-bit half.
[[case]]
name = "shift_8_half_vector"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo_: (0x40 & 0x78) >> 3 = 8"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
v3 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v4 = { u32 = [0x00000000, 0x00000000, 0x00000000, 0x00000040] }
[case.out]
v3 = { u32 = [0x8899AABB, 0xCCDDEEFF, 0x00000000, 0x00000000] }

