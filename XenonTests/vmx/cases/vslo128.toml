# Game register numbers and aliasing
# ---------------------------------------------------------------------------

# vslo128 v63,v58,v63: vB is also vD. The shift byte must be read before the
# store. Shift 4 (one element).
[[case]]
name = "game_v63_v58_v63_vb_aliases_vd"
mnemonic = "vslo128"
source = "ppc_emit_altivec.cc InstrEmit_vslo128; HaloWars site vslo128 v63,v58,v63"
insns = [0x17FAFBB5]   # vslo128 v63,v58,v63
[case.in]
v58 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v63 = { u32 = [0xFFFFFFFF, 0xFFFFFFFF, 0xFFFFFFFF, 0xFFFFFF20] }
[case.out]
v58 = { u32 = [0x00112233, 0x44556677, 0x8899AABB, 0xCCDDEEFF] }
v63 = { u32 = [0x44556677, 0x8899AABB, 0xCCDDEEFF, 0x00000000] }

