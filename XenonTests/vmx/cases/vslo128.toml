name = "xenia_test_vslo_2_shift_1"
mnemonic = "vslo128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vslo.s test_vslo_2; ppc_emit_altivec.cc InstrEmit_vslo_ (0x08 >> 3 = 1 octet)"
insns = [0x14632390]   # vslo128 v3,v3,v4
[case.in]
