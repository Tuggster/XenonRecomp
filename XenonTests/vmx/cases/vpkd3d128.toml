# vpkd3d128 vd, vb, type, pack, shift: VX128_4 form, OP 6, xop 1552.
# Xenia decode (ppc_emit_altivec.cc InstrEmit_vpkd3d128): type = IMM >> 2,
# pack = IMM & 3, shift = z. XenonRecomp's operands[2..4] = VD3D0/VD3D1/VD3D2
# are the same three fields.
#
# Semantics are two steps. Pack(vb, type) builds a packed vector: 32-bit
# formats (D3DCOLOR 0, SHORT_2 1, UINT_2101010 2, FLOAT16_2 3) land in element
# 3 (w), 64-bit formats (SHORT_4 4, FLOAT16_4 5, ULONG_4202020 6) in elements
# 2 (x|y) and 3 (z|w); the rest is zero. Then Permute(control[pack][shift],
# vd, packed) overwrites the selected elements of vd and keeps the others:
#
#   pack 1: shift s writes packed.w into element 3 - s
#   pack 2: s=0 -> z,w = packed.z,w; s=1 -> y,z; s=2 -> x,y; s=3 -> x = packed.w
#   pack 3: as pack 2, except s=3 -> w = packed.z
#
# Float -> half is vcvtps2ph with round-toward-zero (x64_seq_vector.cc PACK
# EmitFLOAT16_2 / EmitFLOAT16_4, imm8 = 3): truncated mantissa, finite
# overflow -> 0x7BFF, inf -> 0x7C00, NaN quieted with its top 10 payload bits,
# half denormals produced, float denormals -> signed zero.
#
# Words for Xenia's cases are its hand-coded .long values; the others come
# from encode.py and the mnemonic guard checks them.

# ---------------------------------------------------------------------------
# Xenia src/xenia/cpu/ppc/testing/instr_vpkd3d128.s, transcribed
# ---------------------------------------------------------------------------

[[case]]
name = "xenia_test_vpkd3d128_d3dcolor_invalid_0"
mnemonic = "vpkd3d128"
source = "xenia src/xenia/cpu/ppc/testing/instr_vpkd3d128.s test_vpkd3d128_d3dcolor_invalid_0; x64_seq_vector.cc PACK EmitD3DCOLOR (vmaxps 3.0, vminps 0x404000FF, low bytes as ARGB)"
insns = [0x18811E10]   # vpkd3d128 v4,v3,0,1,0
[case.in]
v3 = { u32 = [0x00000001, 0x00000002, 0x00000003, 0x00000004] }
v4 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD] }
[case.out]
v3 = { u32 = [0x00000001, 0x00000002, 0x00000003, 0x00000004] }
v4 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD, 0x00000000] }

