# ---------------------------------------------------------------------------
# ULONG_4202020 (type 6). Xenia has no .s test; expectations follow the x64
# sequence: saturate xyz to [0x40380001, 0x4047FFFF] and w to [3.0, 0x4040000F],
# mask to 20/4 bits, then the XZ/YW vpshufb pair builds the 64-bit value
# w:4 z:20 y:20 x:20 with its low dword in element 3 and high dword in
# element 2: elem3 = x | (y & 0xFFF) << 20, elem2 = y >> 12 | z << 8 | w << 28.
# ---------------------------------------------------------------------------

[[case]]
name = "ulong_4202020_2_0_small_values"
mnemonic = "vpkd3d128"
source = "xenia x64_seq_vector.cc PACK EmitULONG_4202020 (XMMPackULONG_4202020_* constants in x64_emitter.cc); x y z w = 3.0 + {1,2,3,1} * 2^-22"
insns = [0x189A1E10]   # vpkd3d128 v4,v3,6,2,0
[case.in]
v3 = { u32 = [0x40400001, 0x40400002, 0x40400003, 0x40400001] }
v4 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD, 0xCDCDCDCD] }
[case.out]
v3 = { u32 = [0x40400001, 0x40400002, 0x40400003, 0x40400001] }
v4 = { u32 = [0xCDCDCDCD, 0xCDCDCDCD, 0x10000300, 0x00200001] }

